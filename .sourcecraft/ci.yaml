on:
  pull_request:
    - workflows: [android-build]
      filter:
        target_branches: "main"

  push:
    - workflows: [android-build]
      filter:
        branches: ["main"]

workflows:
  android-build:
    tasks:
      - name: android-ci
        cubes:
          - name: setup-environment
            retry: 2
            script:
              - |
                set -e
                sudo apt-get update -qq
                sudo apt-get install -y -qq openjdk-17-jdk-headless unzip curl
                export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                export ANDROID_HOME="$HOME/android-sdk"
                mkdir -p "$ANDROID_HOME/cmdline-tools"
                curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
                unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
                mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest" 2>/dev/null || true
                yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
                "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-37" "build-tools;35.0.0" >/dev/null 2>&1 || true
                echo "Android SDK installed at $ANDROID_HOME"

          - name: unit-tests
            retry: 2
            script:
              - |
                set -e
                export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                export ANDROID_HOME="$HOME/android-sdk"
                export ANDROID_SDK_ROOT="$ANDROID_HOME"
                export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
                java -version
                sh ./gradlew --no-daemon test

          - name: assemble-debug
            retry: 2
            script:
              - |
                set -e
                export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
                export ANDROID_HOME="$HOME/android-sdk"
                export ANDROID_SDK_ROOT="$ANDROID_HOME"
                export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
                sh ./gradlew --no-daemon assembleDebug
            artifacts:
              paths:
                - app/build/outputs/apk/debug/*.apk